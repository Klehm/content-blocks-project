name: CI

# Tests gate the split: the read-only mirrors (klehm/content-blocks,
# klehm/content-blocks-kit, klehm/content-blocks-i18n) and the tags Packagist
# consumes are only updated when every suite is green.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request: ~

jobs:
  php-tests:
    name: PHPUnit (PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Full support matrix: Symfony 6.4 LTS / 7.x / 8.x × PHP 8.2–8.4.
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*', '8.*']
        exclude:
          # Symfony 8.0 requires PHP >= 8.4.
          - { php: '8.2', symfony: '8.*' }
          - { php: '8.3', symfony: '8.*' }

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      # Pin the Symfony release line for this leg. flex (installed globally so it
      # is active for the local `composer update` without touching composer.json)
      # reads SYMFONY_REQUIRE and constrains every symfony/* core package to the
      # matrix version — otherwise `composer update` would just take the highest.
      - name: Install flex (Symfony version constraint)
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # `update` rather than `install`: the package is a library, so it resolves
      # its own (highest compatible within the pinned line) dependency set —
      # what consumers on that Symfony line actually get.
      # No `--prefer-dist`: composer 2 already prefers dist for tagged releases,
      # and passing the flag explicitly turns OFF the fallback to git source
      # ("Source fallback is disabled. Not trying alternative sources."). A
      # single flaky zipball download — CI has seen `curl error 60: self-signed
      # certificate` on 2 packages out of 83, from a host that served the other
      # 81 fine — then fails the whole job instead of costing one slower clone.
      - name: Install dependencies
        working-directory: packages/content-blocks
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-progress --no-interaction

      - name: Run PHPUnit
        working-directory: packages/content-blocks
        run: ./vendor/bin/phpunit

  kit-php-tests:
    name: PHPUnit kit (PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same full matrix as the core: Symfony 6.4 / 7.x / 8.x × PHP 8.2–8.4.
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*', '8.*']
        exclude:
          # Symfony 8.0 requires PHP >= 8.4.
          - { php: '8.2', symfony: '8.*' }
          - { php: '8.3', symfony: '8.*' }

    steps:
      # fetch-depth: 0 so the path-repo'd klehm/content-blocks resolves during
      # `composer update`: without tags composer versions the sibling core as
      # `dev-<sha>`, which does not satisfy the kit's `klehm/content-blocks: ^0.1`
      # (same reason as the Playwright job below).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      # Pin the Symfony release line for this leg (see the core job above).
      - name: Install flex (Symfony version constraint)
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # The kit resolves klehm/content-blocks from the sibling package via a
      # path repository (in the kit's composer.json), so it always tests
      # against the monorepo's current core, not the last Packagist release.
      - name: Install dependencies
        working-directory: packages/content-blocks-kit
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-progress --no-interaction

      - name: Run PHPUnit
        working-directory: packages/content-blocks-kit
        run: ./vendor/bin/phpunit

  i18n-php-tests:
    name: PHPUnit i18n (PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same full matrix as the core and the kit.
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*', '8.*']
        exclude:
          # Symfony 8.0 requires PHP >= 8.4.
          - { php: '8.2', symfony: '8.*' }
          - { php: '8.3', symfony: '8.*' }

    steps:
      # fetch-depth: 0 for the same reason as the kit job: without tags,
      # composer versions the path-repo'd sibling core as `dev-<sha>`, which
      # does not satisfy `klehm/content-blocks: ^0.1`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      - name: Install flex (Symfony version constraint)
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # Like the kit, this package path-repos the sibling core, so it always
      # tests against the monorepo's current core rather than a release. That
      # matters more here than anywhere else: the whole design rests on core
      # seams (BlockDataResolverInterface, RenderContext, the `cb_translatable`
      # convention, BlockCloneObserverInterface), and this job is what catches
      # one of them drifting.
      - name: Install dependencies
        working-directory: packages/content-blocks-i18n
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-progress --no-interaction

      - name: Run PHPUnit
        working-directory: packages/content-blocks-i18n
        run: ./vendor/bin/phpunit

  js-tests:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks/package-lock.json

      - name: Install dependencies
        working-directory: packages/content-blocks
        run: npm ci

      - name: Run Vitest
        working-directory: packages/content-blocks
        run: npm run test:unit

  kit-js-tests:
    name: Vitest kit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks-kit/package-lock.json

      - name: Install dependencies
        working-directory: packages/content-blocks-kit
        run: npm ci

      - name: Run Vitest
        working-directory: packages/content-blocks-kit
        run: npm run test:unit

  token-docs:
    name: CSS token docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Every --cb-* token is public surface from 1.0, so a token added to a
      # package stylesheet without a docs entry is a silent freeze. Lives here
      # rather than in the docs workflow because that one only fires on docs/**,
      # and the drift is introduced in packages/**.
      - name: Check every --cb-* token is documented
        working-directory: docs
        run: node scripts/check-tokens.mjs

  i18n-js-tests:
    name: Vitest i18n
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks-i18n/package-lock.json

      - name: Install dependencies
        working-directory: packages/content-blocks-i18n
        run: npm ci

      - name: Run Vitest
        working-directory: packages/content-blocks-i18n
        run: npm run test:unit

  e2e-tests:
    name: Playwright (PHP ${{ matrix.php }} · ${{ matrix.stack }})
    runs-on: ubuntu-latest

    # Two legs, both gating the split:
    #   - 8.3 `install` reproduces the locked baseline (Symfony 7 · UX 2).
    #   - 8.4 `update` resolves the highest compatible set (Symfony 8 · UX 3) —
    #     what consumers on the newest stack actually get — so the browser suite
    #     validates the UX 3 JS (Live checksum, controllers) end to end too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            composer: install
            stack: 'locked (Symfony 7 · UX 2)'
          - php: '8.4'
            composer: update
            stack: 'highest (Symfony 8 · UX 3)'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # fetch-depth: 0 so the path-repo'd klehm packages resolve during
      # `composer update`: without tags, composer versions the local package as
      # `dev-<sha>`, which does not satisfy the kit's `klehm/content-blocks: ^0.1`
      # constraint and the update fails. Full history lets it derive a matching
      # version. (The `install` baseline reads the lock and is unaffected.)
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: the sandbox demos the image seam through LiipImagine, which
          # needs an imagine driver to produce its WebP variants.
          extensions: pdo_mysql, intl, mbstring, gd
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks/package-lock.json

      # `install` on the locked leg (reproducible baseline); `update` on the 8.4
      # leg so composer resolves the newest compatible set (Symfony 8 · UX 3)
      # rather than the Symfony-7 versions pinned in the committed lock.
      - name: Install sandbox dependencies
        working-directory: apps/content-blocks-sandbox
        run: composer ${{ matrix.composer }} --no-progress --no-interaction

      - name: Configure the sandbox database
        working-directory: apps/content-blocks-sandbox
        run: |
          echo 'DATABASE_URL="mysql://root:root@127.0.0.1:3306/content_blocks_sandbox?serverVersion=8.0&charset=utf8mb4"' > .env.local
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create

      - name: Install JS dependencies
        working-directory: packages/content-blocks
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/content-blocks
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: packages/content-blocks
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-php${{ matrix.php }}
          path: |
            packages/content-blocks/test-results/
          retention-days: 7

  encore-e2e-tests:
    name: Playwright Encore (PHP 8.3 · Symfony 6.4 · Webpack)
    runs-on: ubuntu-latest

    # The install path the other e2e job cannot see. That sandbox builds with
    # AssetMapper on Symfony 7/8; this one is Webpack Encore on Symfony 6.4 with
    # Doctrine ORM 2, and `symfony/asset-mapper` sits in its composer `conflict`
    # so the leg can never silently drift back onto the covered path.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # fetch-depth: 0 for the path-repo'd klehm packages — same reason as the
      # kit and e2e jobs above.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install sandbox dependencies
        working-directory: apps/content-blocks-encore-sandbox
        run: composer install --no-progress --no-interaction

      - name: Configure the sandbox database
        working-directory: apps/content-blocks-encore-sandbox
        run: |
          echo 'DATABASE_URL="mysql://root:root@127.0.0.1:3306/content_blocks_encore_sandbox?serverVersion=8.0&charset=utf8mb4"' > .env.local
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create

      # The npm links resolve through vendor/, so this must follow composer.
      - name: Build the assets with Encore
        working-directory: apps/content-blocks-encore-sandbox
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install JS dependencies
        working-directory: packages/content-blocks
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/content-blocks
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (Encore suite)
        working-directory: packages/content-blocks
        run: npx playwright test --config=playwright.encore.config.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-encore
          path: |
            packages/content-blocks/test-results/
          retention-days: 7

  # ---- Monorepo split (only after every test job is green) ----

  packages_split:
    name: Split ${{ matrix.package.split_repository }}
    runs-on: ubuntu-latest
    needs: [php-tests, kit-php-tests, i18n-php-tests, js-tests, kit-js-tests, i18n-js-tests, e2e-tests, encore-e2e-tests]
    # PRs never split; only pushes to master and v* tags do.
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: content-blocks
            split_repository: content-blocks
          - local_path: content-blocks-kit
            split_repository: content-blocks-kit
          - local_path: content-blocks-i18n
            split_repository: content-blocks-i18n

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Branch push: keep split repos in sync with master
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: klehm
          repository_name: ${{ matrix.package.split_repository }}
          user_name: 'Clément Muller'
          user_email: 'klehm.muller@gmail.com'

      # Tag push: propagate the tag to each split repo
      - if: "startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: klehm
          repository_name: ${{ matrix.package.split_repository }}
          user_name: 'Clément Muller'
          user_email: 'klehm.muller@gmail.com'
