name: CI

# Tests gate the split: the read-only mirrors (klehm/content-blocks,
# klehm/content-blocks-kit) and the tags Packagist consumes are only
# updated when every suite is green.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request: ~

jobs:
  php-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      # `update` rather than `install`: the package is a library, so each
      # PHP version resolves its own (highest compatible) dependency set —
      # this is what consumers will actually get.
      - name: Install dependencies
        working-directory: packages/content-blocks
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        working-directory: packages/content-blocks
        run: ./vendor/bin/phpunit

  js-tests:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks/package-lock.json

      - name: Install dependencies
        working-directory: packages/content-blocks
        run: npm ci

      - name: Run Vitest
        working-directory: packages/content-blocks
        run: npm run test:unit

  e2e-tests:
    name: Playwright (e2e)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/content-blocks/package-lock.json

      - name: Install sandbox dependencies
        working-directory: apps/content-blocks-sandbox
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configure the sandbox database
        working-directory: apps/content-blocks-sandbox
        run: |
          echo 'DATABASE_URL="mysql://root:root@127.0.0.1:3306/content_blocks_sandbox?serverVersion=8.0&charset=utf8mb4"' > .env.local
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create

      - name: Install JS dependencies
        working-directory: packages/content-blocks
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/content-blocks
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: packages/content-blocks
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/content-blocks/test-results/
          retention-days: 7

  # ---- Monorepo split (only after every test job is green) ----

  packages_split:
    name: Split ${{ matrix.package.split_repository }}
    runs-on: ubuntu-latest
    needs: [php-tests, js-tests, e2e-tests]
    # PRs never split; only pushes to master and v* tags do.
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: content-blocks
            split_repository: content-blocks
          - local_path: content-blocks-kit
            split_repository: content-blocks-kit

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Branch push: keep split repos in sync with master
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: klehm
          repository_name: ${{ matrix.package.split_repository }}
          user_name: 'Clément Muller'
          user_email: 'klehm.muller@gmail.com'

      # Tag push: propagate the tag to each split repo
      - if: "startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: klehm
          repository_name: ${{ matrix.package.split_repository }}
          user_name: 'Clément Muller'
          user_email: 'klehm.muller@gmail.com'
