# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'en'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Menu\AdminMenuBuilder:
        decorates: sylius_admin_ui.knp.menu_builder
        arguments:
            $factory: '@knp_menu.factory'

    # Override ContentBlocks default (DenyAll) for sandbox development
    ContentBlocks\Security\AccessCheckerInterface:
        class: ContentBlocks\Security\AllowAllAccessChecker

    # Override ContentBlocks default (DenyAll) so the section-template library
    # is manageable (rename/delete) in the sandbox
    ContentBlocks\SectionTemplate\SectionTemplateManagerInterface:
        class: ContentBlocks\SectionTemplate\AllowAllSectionTemplateManager

    # Maps a ContentArea to its public URL (used by the iframe preview)
    ContentBlocks\Preview\ContentAreaUrlResolverInterface:
        class: App\Preview\PageContentAreaUrlResolver

    # Local file storage for ContentBlocks uploads
    ContentBlocks\Kit\Storage\FileStorageInterface:
        class: ContentBlocks\Kit\Storage\LocalFileStorage
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/content-blocks'
            $publicPrefix: '/uploads/content-blocks'
