parameters:
    # Default fallback for the ANTHROPIC_MODEL env var. Claude Opus 5 is the
    # current flagship; override the env var to trade capability for cost.
    cb_i18n_default_model: 'claude-opus-5'
    # Provider used when nothing is set: deterministic and offline, so a fresh
    # checkout and the e2e suite both work with no credentials.
    cb_i18n_default_provider: 'pseudo'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    # Override ContentBlocks default (DenyAll) for sandbox development
    ContentBlocks\Security\AccessCheckerInterface:
        class: ContentBlocks\Security\AllowAllAccessChecker

    # Override ContentBlocks default (DenyAll) so the section-template library
    # is manageable (rename/delete) in the sandbox
    ContentBlocks\SectionTemplate\SectionTemplateManagerInterface:
        class: ContentBlocks\SectionTemplate\AllowAllSectionTemplateManager

    # Maps a ContentArea to its public URL (used by the iframe preview)
    ContentBlocks\Preview\ContentAreaUrlResolverInterface:
        class: App\Preview\PageContentAreaUrlResolver

    # File storage moved to the main package and is now configured via the
    # content_blocks.upload semantic config (see config/packages/content_blocks.yaml)

    # Image optimization: swap the bundle's passthrough resolver for one backed
    # by LiipImagine, so every picture the kit renders comes out as a WebP sized
    # for its box. This one alias is the entire opt-in — no template override
    # anywhere. See docs/guide/recipes/liip-imagine.md.
    ContentBlocks\Image\ImageUrlResolverInterface:
        class: App\Image\LiipImagineImageUrlResolver

    # ---- Machine translation ----------------------------------------------
    #
    # Two providers, both auto-tagged through the package's
    # TranslationProviderInterface autoconfiguration. Which one runs is decided
    # by `content_blocks_i18n.machine.default` (env CB_I18N_PROVIDER, default
    # `pseudo`), so the sandbox works offline out of the box and shows real
    # output the moment a key is present.
    #
    #   pseudo  — deterministic, no network. The e2e suite drives this one.
    #   claude  — the real thing, via the official Anthropic PHP SDK.
    #
    # The client is constructed with whatever ANTHROPIC_API_KEY holds, including
    # nothing: an empty key builds fine and fails at call time with a message
    # the workbench can show, which beats a container that refuses to boot.
    Anthropic\Client:
        arguments:
            $apiKey: '%env(default::ANTHROPIC_API_KEY)%'

    App\Translation\ClaudeTranslationProvider:
        arguments:
            $client: '@Anthropic\Client'
            $model: '%env(default:cb_i18n_default_model:ANTHROPIC_MODEL)%'
