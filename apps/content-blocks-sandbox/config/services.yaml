services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    # Override ContentBlocks default (DenyAll) for sandbox development
    ContentBlocks\Security\AccessCheckerInterface:
        class: ContentBlocks\Security\AllowAllAccessChecker

    # Override ContentBlocks default (DenyAll) so the section-template library
    # is manageable (rename/delete) in the sandbox
    ContentBlocks\SectionTemplate\SectionTemplateManagerInterface:
        class: ContentBlocks\SectionTemplate\AllowAllSectionTemplateManager

    # Maps a ContentArea to its public URL (used by the iframe preview)
    ContentBlocks\Preview\ContentAreaUrlResolverInterface:
        class: App\Preview\PageContentAreaUrlResolver

    # File storage moved to the main package and is now configured via the
    # content_blocks.upload semantic config (see config/packages/content_blocks.yaml)

    # Image optimization: swap the bundle's passthrough resolver for one backed
    # by LiipImagine, so every picture the kit renders comes out as a WebP sized
    # for its box. This one alias is the entire opt-in — no template override
    # anywhere. See docs/guide/recipes/liip-imagine.md.
    ContentBlocks\Image\ImageUrlResolverInterface:
        class: App\Image\LiipImagineImageUrlResolver
