doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        # `auto_generate_proxy_classes` was removed in doctrine-bundle 3.0 (a no-op
        # under ORM 3 + PHP 8.4 native lazy objects). Omitting it keeps this config
        # valid on both bundle 2.x (Symfony 7 leg) and 3.x (Symfony 8 · PHP 8.4).
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            ContentBlocks:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/vendor/klehm/content-blocks/src/Entity'
                prefix: 'ContentBlocks\Entity'
                alias: ContentBlocks
