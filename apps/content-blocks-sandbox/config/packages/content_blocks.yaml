# Semantic config of the ContentBlocks bundle — exercises every declarative
# extension point (colors, style presets, uploads). Interfaces remain the
# power-user path (ColorPaletteProviderInterface, SectionStyleProviderInterface,
# FileStorageInterface).
content_blocks:
    section:
        default_width_mode: full
        default_max_width: 1320
        # Added after the built-in full / two_cols / three_cols buttons. Spans
        # are on a 12-unit grid and must add up to 12.
        layouts:
            four_cols: { label: '4 colonnes', columns: [3, 3, 3, 3] }
            sidebar_left: { label: 'Barre latérale + contenu', columns: [4, 8] }
            # Same columns, shown one at a time; the editor names each tab.
            tabs: { label: 'Onglets', columns: [4, 4, 4], display: tabs }

    # Named colors offered by the palette color picker (background colors of
    # sections and blocks). Editors can still switch to "Custom…" for a free
    # color picker.
    palette:
        - { label: 'Indigo', color: '#4f46e5' }
        - { label: 'Sky', color: '#e0f2fe' }
        - { label: 'Slate', color: '#f1f5f9' }
        - { label: 'White', color: '#ffffff' }
        - { label: 'Ink', color: '#111827' }

    # Section style presets: a CSS class (styled in app.css) and/or settings
    # values applied underneath the section's own settings. Editors pick a
    # preset from the dropdown; the "Customize styling" switch reveals the
    # full styling fields, prefilled from the preset.
    section_styles:
        - name: boxed
          label: 'Boxed'
          css_class: 'demo-section--boxed'
          settings:
              styling:
                  backgroundColor: '#f1f5f9'
                  padding: { desktop: { top: 40, right: 40, bottom: 40, left: 40 } }
        - name: airy
          label: 'Airy'
          settings:
              styling:
                  padding: { desktop: { top: 96, bottom: 96 }, mobile: { top: 48, bottom: 48 } }

    # Enables the upload endpoint with a LocalFileStorage.
    upload:
        directory: '%kernel.project_dir%/public/uploads/content-blocks'
        public_prefix: '/uploads/content-blocks'
        # The default list is images + PDF; the kit's video block needs these.
        max_size: 52428800
        allowed_mime_types:
            - image/jpeg
            - image/png
            - image/gif
            - image/webp
            - image/svg+xml
            - application/pdf
            - video/mp4
            - video/webm
