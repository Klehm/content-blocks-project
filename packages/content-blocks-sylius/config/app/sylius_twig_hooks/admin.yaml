sylius_twig_hooks:
    hooks:
        'sylius_admin.content_page.create.content.form.sections':
            general:
                template: '@ContentBlocksSyliusPlugin/admin/content_page/form/general.html.twig'
                priority: 100
            content:
                template: '@ContentBlocksSyliusPlugin/admin/content_page/form/content.html.twig'
                priority: 0

        'sylius_admin.content_page.update.content.form.sections':
            general:
                template: '@ContentBlocksSyliusPlugin/admin/content_page/form/general.html.twig'
                priority: 100
            content:
                template: '@ContentBlocksSyliusPlugin/admin/content_page/form/content.html.twig'
                priority: 0

        'content_blocks_sylius.admin.slot.index':
            content:
                template: '@ContentBlocksSyliusPlugin/admin/slot/content.html.twig'
                priority: 0

        'content_blocks_sylius.admin.homepage.index':
            content:
                template: '@ContentBlocksSyliusPlugin/admin/homepage/content.html.twig'
                priority: 0

        'sylius_admin.product.update.content.header.title_block.actions':
            content_blocks:
                template: '@ContentBlocksSyliusPlugin/admin/product/builder_button.html.twig'
                priority: 250

        'sylius_admin.taxon.update.content.header.title_block.actions':
            content_blocks:
                template: '@ContentBlocksSyliusPlugin/admin/taxon/builder_button.html.twig'
                priority: 100
